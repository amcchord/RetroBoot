# RetroBoot Raspberry Pi 4/5 image (image/rpi/build.sh; read with rcfg in scripts/rpi-lib.sh).
# Everything not set here comes from image/config/image.conf (version, Debian suite and
# mirrors, guest fixtures, partition sizes of the shared layout).
arch=arm64
# Boot pieces only come from the Raspberry Pi archive (apt-pinned, see config/apt-preferences).
rpi_mirror=http://archive.raspberrypi.com/debian
rpi_suite=trixie
rpi_components=main
# "Raspberry Pi Archive Signing Key" (rsa2048, 2012-06-17), checked against
# apt/raspberrypi-archive-keyring.asc before every base build.
rpi_archive_key_fpr=CF8A1AF502A2AA2D763BAE7E82B129927FA3303E
# Kernel flavour booted on both boards (4 KiB pages; kernel8.img, initramfs8).
rpi_kernel_flavour=v8
# Boot partition (partition 1, PARTLABEL RBEFI): FAT32 with the GPT type
# "Microsoft basic data" (EBD0A0A2-B9E5-4433-87C0-68B6B72699C7), which the Pi 4
# bootloader accepts since EEPROM 2020-09-03 and every Pi 5 bootloader accepts.
rpi_boot_type=0700
# RBDATA in the raw image (grows to the end of the card or SSD on first boot).
# Private: the embedded guest disk has about 0.5 GB allocated.
data_mib=2048
data_mib_private=4096
# Zero 2 W 4-partition MBR layout (boot + two root slots + XFS data):
# 256 + 2560 + 2560 + 1024 = 6400 MiB (fits an 8 GB SD card; rb-growdata grows p4).
root_mib_zero2w=2560
data_mib_zero2w=1024
