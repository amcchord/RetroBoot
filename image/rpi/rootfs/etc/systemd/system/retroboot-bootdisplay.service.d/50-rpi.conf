# Raspberry Pi (image/rpi/rootfs): no GRUB and no /sys/kernel/boot_params; keep the
# splash's startup arguments in the boot partition's cmdline.txt instead
# (rb-bootdisplay-rpi). hostd starts this unit when a setting it depends on changes.
[Unit]
Description=Keep the startup splash arguments in the Raspberry Pi cmdline.txt
ConditionPathExists=
ConditionPathExists=/usr/lib/retroboot/image/rb-bootdisplay-rpi

[Service]
ExecStart=
ExecStart=/usr/lib/retroboot/image/rb-bootdisplay-rpi
