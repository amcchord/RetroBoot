# RetroBoot on the Raspberry Pi (image/rpi/rootfs): the camera, ISP and video codec
# drivers bind at every boot (udev, device tree) and reserve CMA memory and VideoCore
# services RetroBoot never uses. vchiq itself stays: the Pi 4's headphone jack
# (snd_bcm2835) needs it. HDMI audio is vc4's own (vc4-hdmi).
blacklist bcm2835_codec
blacklist bcm2835_isp
blacklist bcm2835_v4l2
blacklist bcm2835_mmal_vchiq
blacklist bcm2835_unicam
blacklist rpi_hevc_dec
blacklist pisp_be
blacklist rp1_cfe
blacklist imx219
blacklist imx477
blacklist imx708
blacklist ov5647
