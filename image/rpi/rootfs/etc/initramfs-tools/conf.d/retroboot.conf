# RetroBoot initramfs on the Raspberry Pi (image/rpi/rootfs; replaces the x86 file).
# The Raspberry Pi kernel builds in everything the root needs: SD (sdhci-iproc on the
# Pi 4, sdhci-brcmstb on the Pi 5), USB storage and UAS, xHCI on PCIe (Pi 4's VL805)
# and on RP1 (Pi 5), NVMe and ext4. So the initramfs only carries what
# hooks/retroboot-modules and the presenter's retroboot-splash hook add (the KMS
# driver for the splash, xfs), not MODULES=most: the GPU firmware reads it from the
# card before Linux starts, and every megabyte is time on the way to the checkerboard.
MODULES=list
# The root is always ext4 (RBROOT_A): name it, so initramfs-tools' fsck hook includes fsck,
# fsck.ext4 and logsave whatever the build host is (it cannot detect the type from
# PARTLABEL=RBROOT_A in a chroot).
FSTYPE=ext4
BUSYBOX=y
COMPRESS=zstd
COMPRESSLEVEL=9
RESUME=none
