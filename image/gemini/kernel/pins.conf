# Pinned inputs of the Gemini PDA kernel build (sourced by build-kernel.sh).
# Nothing from the upstream repository is vendored into RetroBoot's Git: it has no
# LICENSE file apart from the GPL-2.0 kernel source. build-kernel.sh fetches it at
# build time into the builder work area and records every input hash in the manifest.

# atzandrew/gemini-nixos (a fork of cjdell/gemini-nixos): kernel delta tree, lean
# config, CONSYS ROM patches, out-of-tree modules, boot geometry.
UPSTREAM_REPO=https://github.com/atzandrew/gemini-nixos.git
UPSTREAM_REV=6a172f513ba8c4f7d00e4be6a954858e238fa12c
UPSTREAM_DEVICE_DIR=devices/planet-geminipda
UPSTREAM_FIRMWARE_DIR=pkgs/gemini-firmware

# The published base tarball (kernel/default.nix: SRI sha256-ivJdzP2ko+vxcSL/3BGSHq8ie2oOmC4Vlqzz+MkNpkI=).
LINUX_VERSION=6.6.157
LINUX_URL=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.157.tar.gz
LINUX_SHA256=8af25dccfda4a3ebf17122ffdc11921eaf227b6a0e982e1596acf3f8c90da642

# Debian 13's cross compiler (upstream builds with GCC 15.2.0; see README "Toolchain").
CROSS_COMPILE=aarch64-linux-gnu-
KARCH=arm64

# The DTB LK finds appended to the gzip payload.
DTB_PATH=mediatek/mt6797-gemini-pda.dtb

# Out-of-tree modules (upstream kernel/modules/<name>). Shipped ones land in
# lib/modules/<ver>/extra/. sramldo-smc is compiled to prove it still builds but is
# not shipped: c028f86 moved the A72 bring-up into the kernel (mt6797-cl2-power), and
# upstream's Debian dropped the module load. Set SHIP_SRAMLDO=1 to ship it anyway.
OOT_MODULES_SHIPPED="mt6351-gauge"
OOT_MODULES_BUILD_ONLY="sramldo-smc"
