# RetroBoot on the Planet Computers Gemini PDA (image/gemini/build.sh; read with gcfg in
# scripts/gemini-lib.sh). Everything not set here comes from image/config/image.conf
# (version, Debian suite and mirrors, guest fixtures).
arch=arm64
hostname=retroboot-gemini
# The kernel of wave7/gemini-kernel's boot.img; its modules tree must be exactly this.
kernel_version=6.6.157
# Kernel handoff (boot.img, modules tarball, counter contract), written by wave7/gemini-kernel.
kernel_handoff=/srv/retroboot/wave7/handoff/gemini-kernel.json
# Where RetroBoot lives on the Gemini: a directory of the ext4 file system on the GPT
# partition PARTNAME=linux (p29, beside Gemian). The initrd bind-mounts it as /.
root_dir=/retroboot
# GPT partition names (found by PARTNAME, never by number: the eMMC is mmcblk0 or mmcblk1).
part_boot=boot
part_para=para
part_linux=linux
part_nvdata=nvdata
# USB gadget network (g_ether, built into the kernel): the fallback path, as gemini-debian.
usb0_address=10.15.19.82/24
# Panel backlight at boot (percent of max_brightness); /etc/default/retroboot-gemini.
backlight_percent=40

# ---- upstream (no license: fetched at build time from pinned commits, never in Git) ----
# atzandrew/gemini-nixos: firmware for the MT6630 CONSYS Wi-Fi/Bluetooth and the battery
# guard. Each upstream_file line is DEST|PATH-IN-REPO|SHA256 (checked after the fetch).
# Never WIFI_factory.bin: every unit's Wi-Fi record (MAC + TX calibration) comes from its
# own nvdata partition at boot (rb-gemini-wifi-nvram).
gemini_nixos_url=https://github.com/atzandrew/gemini-nixos.git
gemini_nixos_commit=6a172f513ba8c4f7d00e4be6a954858e238fa12c
upstream_file=/usr/lib/firmware/WMT_SOC.cfg|pkgs/gemini-firmware/WMT_SOC.cfg|f4a59b622a4e0c1470e475ce33f3edae43b27f1fbdeba54dc7cf07503d132880
upstream_file=/usr/lib/firmware/ROMv3_patch_1_0_hdr.bin|pkgs/gemini-firmware/ROMv3_patch_1_0_hdr.bin|d85864206b999501568a69edd8305319f9961fb65d56f77f438be29ff05c57a8
upstream_file=/usr/lib/firmware/ROMv3_patch_1_1_hdr.bin|pkgs/gemini-firmware/ROMv3_patch_1_1_hdr.bin|8982bba207df136fe56be1b9d5f394d89128b3fd41977a8741928fe105399784
upstream_file=/usr/lib/firmware/WIFI_RAM_CODE_6797|pkgs/gemini-firmware/WIFI_RAM_CODE_6797|c28c50efd411c591372b3a57a46cb99709db56e6cd86d65022af2baa88d840a6
upstream_file=/usr/lib/retroboot/gemini/upstream/battery-guard.sh|services/scripts/battery-guard.sh|ba9e73e28dc064f6d5b13f304bc98c2aa58b330d351db680a6c1510cbfd0c0e4
# atzandrew/gemini-debian: the Debian 13 rootfs for this kernel. Read as the reference for
# the hardware services; RetroBoot's units and scripts reimplement its behaviour, so
# nothing is fetched from it (recorded in the manifest as the reference revision).
gemini_debian_url=https://github.com/atzandrew/gemini-debian.git
gemini_debian_commit=355bc5a8e9179af67914b0b883229ff3b33429d3
# Static aarch64 zstd decompressor for the installer (Gemian 9 may lack zstd): built
# from installer/rb-unzstd.c against Debian trixie's arm64 libzstd-dev (libzstd.a) with
# the builder's aarch64 cross compiler; the .deb's SHA-256 goes into the manifest.
unzstd_deb=libzstd-dev
