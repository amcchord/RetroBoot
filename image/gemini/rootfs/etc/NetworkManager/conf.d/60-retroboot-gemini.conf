# RetroBoot on the Gemini PDA (the MT6630 wlan_gen3 driver).
[main]
# Keep retrying saved networks for ever (the default gives up after 4 tries): the
# coordinator and the web settings reach the Gemini over Wi-Fi only.
autoconnect-retries-default=0

[device]
# The driver has no MAC randomisation support.
wifi.scan-rand-mac-address=no
