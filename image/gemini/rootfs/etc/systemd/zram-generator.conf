# RetroBoot on the Gemini PDA: compressed swap in RAM (systemd-zram-generator; the kernel
# has CONFIG_ZRAM=y and lzo-rle). 3.8 GB is enough for the emulator (guest RAM plus the
# TCG code buffer), the presenter and hostd; zram is the cushion for the moments that
# add up (the Modern Web Helper, a Platinum bundle build, guest preparation), so the
# OOM killer never picks the emulator. A quarter of RAM, at most 1 GiB, used before any
# other swap (there is none).
[zram0]
zram-size = min(ram / 4, 1024)
compression-algorithm = lzo-rle
swap-priority = 100
