# RetroBoot on the Gemini PDA: watchdog-safe reboot and poweroff.
# `systemctl reboot` and `poweroff` use the kernel's MT6797 restart and MT6351 poweroff
# handlers. The SoC watchdog (mtk-wdt, at most 31 s) is never armed while the system
# runs; for the last phase of a reboot systemd arms it for 30 s, so a reboot that hangs
# there still comes back through the watchdog's external reset (which self-boots). A
# poweroff disarms it, so a poweroff never turns into a reboot.
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=30s
