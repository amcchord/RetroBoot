# RetroBoot on the Gemini PDA: /var/lib/retroboot is a plain directory of the root (the
# root itself is the /retroboot directory of the PARTNAME=linux ext4 file system; there
# is no RBDATA partition). An empty Condition resets the unit's conditions, so the
# layout is still checked at every boot.
[Unit]
ConditionPathIsMountPoint=
