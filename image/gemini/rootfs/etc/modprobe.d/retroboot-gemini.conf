# RetroBoot on the Gemini PDA (image/gemini/rootfs).
# RetroBoot never powers the Mali-T880 (the presenter scans out through geminipda-drm and
# the emulator's GL runs on llvmpipe): panfrost must not probe the unpowered GPU (its soft
# reset times out and leaves the module loaded but failed).
blacklist panfrost
# The MT6351 fuel gauge registers as the system battery (/sys/class/power_supply/mt6351-battery).
options mt6351_gauge system=1
# geminipda-drm skips the CPU cache maintenance around the scanout copy (7.9 -> 3.3 ms per
# full frame; gemini-debian's default since 2026-10-03). The risk is visual only: a rare
# stale 16x1-pixel sliver until that spot redraws. Set cache_sync=1 if slivers show
# (/sys/module/geminipda_drm/parameters/cache_sync at run time).
options geminipda-drm cache_sync=0
