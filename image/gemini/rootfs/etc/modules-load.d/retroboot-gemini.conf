# RetroBoot on the Gemini PDA: modules loaded by systemd-modules-load, before any unit
# that needs them. The list is checked against the kernel handoff's module tree at
# build time (image/gemini/scripts/check-gemini.sh). (The MT6351 side keys and Esc/On
# long press, CONFIG_KEYBOARD_MT6351, are built into the kernel.)
# DRM first: wlan_gen3 also registers char major 226; whichever loads first wins, and if
# Wi-Fi wins, drm.ko fails with EBUSY and there is no display. retroboot-gemini-wifi
# runs after systemd-modules-load.
drm
# MT6351 coulomb-counting fuel gauge (battery guard, hostd's battery level)
mt6351_gauge
