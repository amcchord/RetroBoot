# RetroBoot on the Gemini PDA.
# Keyboard matrix scan interval (matrix_keypad's poll_ms, default 20 ms): each scan costs
# about 54 I2C interrupts; 30 ms keeps fast typing crisp at about 2200 interrupts/s
# (gemini-debian's choice).
w /sys/module/matrix_keypad/parameters/poll_ms - - - - 30
# wlan_gen3 reads this unit's Wi-Fi record here (rb-gemini-wifi-nvram puts it there).
d /data/nvram/APCFG/APRDEB 0755 root root -
d /var/lib/retroboot/gemini 0755 root root -
