# RetroBoot appliance image configuration (read by image/scripts/lib.sh:cfg)
version=3.0.5
debian_suite=trixie
debian_mirror=http://deb.debian.org/debian
debian_security_mirror=http://deb.debian.org/debian-security
debian_components=main non-free-firmware non-free
grub_debian_version=2.12-9+deb13u2
# GPT layout in MiB (ARCHITECTURE section 8)
esp_mib=256
biosboot_mib=1
root_mib=3072
# RBDATA in the raw image; it grows to fill a larger disk on first boot.
data_mib=2048
data_mib_private=6144
# Universal installer medium (build.sh --universal, ARCHITECTURE 8.1): partition 1, the FAT32
# RBINSTEFI with the Raspberry Pi boot files and the PC's EFI loader (as large as Raspberry
# Pi OS's boot partition; room for Startup Details reports and user files).
universal_fat_mib=512
# Software Update (ARCHITECTURE 13): the oldest installed release a bundle of this
# build can update (0.2.0: the first A/B layout, before the slot-aware grub.cfg).
update_min_version=0.2.0

# Supply a locally authorized machine with --embed-machine DIR.
