# RetroBoot CUPS file locations: keep static policy in /etc/cups (A/B image)
# and persist configured queues, PPDs, and certificates on RBDATA.
SystemGroup root lpadmin
AccessLog syslog
ErrorLog syslog
PageLog none
ServerRoot /var/lib/retroboot/cups
RequestRoot /var/spool/cups
TempDir /var/spool/cups/tmp
CacheDir /var/cache/cups
StateDir /run/cups
DataDir /usr/share/cups
DocumentRoot /usr/share/cups/doc-root
Printcap
