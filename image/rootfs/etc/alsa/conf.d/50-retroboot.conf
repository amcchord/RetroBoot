# RetroBoot (hostd/retroboot/audio.py): a playback device that keeps the hardware
# stream running while the guest has it open. Used for ASoC machine drivers that
# mute the speaker amplifier at every PCM stop and unmute it only when the output
# stage powers up again (Everest ES8336, sof_es8336.c): QEMU stops its stream
# after each Mac OS sound and keeps the device open, so without this only the
# first sound was audible.  rb_keepalive:CARD=<id>,DEV=<n>
pcm.rb_keepalive {
	@args [ CARD DEV ]
	@args.CARD { type string }
	@args.DEV { type integer default 0 }
	type plug
	slave.pcm {
		type dmix
		ipc_key 5242880
		ipc_key_add_uid true
		ipc_perm 0600
		slave {
			pcm { type hw card $CARD device $DEV }
			format S16_LE
			rate 48000
			channels 2
			period_size 512
			buffer_size 4096
		}
	}
}
