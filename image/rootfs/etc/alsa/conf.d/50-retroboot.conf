# RetroBoot (hostd/retroboot/audio.py): shared dmix keepalive and softvol PCMs.
#
# - rb_keepalive: keeps the hardware stream open for ASoC drivers that mute the
#   speaker amp on PCM stop (sof_es8336) and non-Intel HD Audio controllers whose
#   128-byte buffer alignment breaks QEMU's 44.1 kHz plughw stream.
# - rb_softvol_keepalive / rb_softvol: wraps ALSA softvol ("RetroBoot Playback
#   Volume") for outputs without a hardware playback mixer (e.g., AMD/Intel/NVIDIA
#   HDMI codecs and mixerless USB DACs).
#
# Group-writable (audio) shared dmix IPC lets hostd (root: startup chimes, Test
# Sound, key clicks, softvol priming) and QEMU (rbguest, member of audio) share
# the same dmix instance cleanly.

pcm.rb_keepalive {
	@args [ CARD DEV ]
	@args.CARD { type string }
	@args.DEV { type integer default 0 }
	type plug
	slave.pcm {
		type dmix
		ipc_key 5242880
		ipc_key_add_uid false
		ipc_gid audio
		ipc_perm 0660
		slave {
			pcm { type hw card $CARD device $DEV }
			format S16_LE
			rate 48000
			channels 2
			period_size 512
			buffer_size 8192
		}
	}
}

pcm.rb_softvol_keepalive {
	@args [ CARD DEV ]
	@args.CARD { type string }
	@args.DEV { type integer default 0 }
	type plug
	slave.pcm {
		type softvol
		slave.pcm {
			type dmix
			ipc_key 5242881
			ipc_key_add_uid false
			ipc_gid audio
			ipc_perm 0660
			slave {
				pcm { type hw card $CARD device $DEV }
				format S16_LE
				rate 48000
				channels 2
				period_size 512
				buffer_size 8192
			}
		}
		control {
			name "RetroBoot Playback Volume"
			card $CARD
		}
		min_dB -51.0
		max_dB 0.0
		resolution 256
	}
}

pcm.rb_softvol {
	@args [ CARD DEV ]
	@args.CARD { type string }
	@args.DEV { type integer default 0 }
	type plug
	slave.pcm {
		type softvol
		slave.pcm {
			type hw
			card $CARD
			device $DEV
		}
		control {
			name "RetroBoot Playback Volume"
			card $CARD
		}
		min_dB -51.0
		max_dB 0.0
		resolution 256
	}
}
