# RetroBoot: no Wi-Fi power save on Realtek rtw88 adapters. With it on, an
# RTL8821CE answered pings in 18-460 ms (mean 158 ms) instead of 1-6 ms, which
# Mac OS feels through AirPort and NAT, and its leisure power save is where the
# firmware hang above begins (modprobe.d/retroboot-wifi.conf). Other drivers keep
# NetworkManager's default.
[connection-retroboot-rtw88-powersave]
match-device=driver:rtw_8821ce,driver:rtw_8822ce,driver:rtw_8822be,driver:rtw_8723de
wifi.powersave=2
