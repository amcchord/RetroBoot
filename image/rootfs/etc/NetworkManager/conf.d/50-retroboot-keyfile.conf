# RetroBoot: host network profiles live on the data partition (RBDATA), so they
# survive A/B root updates and the installer can carry a network joined during
# installation to the installed system. hostd writes the keyfiles (0600) in this
# directory (hostd/retroboot/network.py); NetworkManager no longer reads
# /etc/NetworkManager/system-connections, and hostd moves profiles of earlier
# releases from there once at startup.
[keyfile]
path=/var/lib/retroboot/network/connections
