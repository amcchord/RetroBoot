# RetroBoot: Realtek rtw88 PCIe Wi-Fi (RTL8821CE, RTL8822CE/BE, RTL8723DE).
# On an N5105 laptop with an RTL8821CE the firmware stopped acknowledging the
# deep power-save handshake six minutes after boot ("firmware failed to ack
# driver for entering Deep Power mode", then "failed to send h2c command" and
# "firmware failed to leave lps state" every 2 s); Wi-Fi died and the whole
# machine froze. The PCIe link also logged correctable receiver errors with
# ASPM L0s/L1 on. Deep power save and ASPM stay off for this driver family
# (image/reports/hardware-n5105-2026-10-11.md). Other Wi-Fi drivers are unaffected.
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
