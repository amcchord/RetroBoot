# RetroBoot (image/rootfs): BlueZ for Bluetooth keyboards, mice, trackpads and game
# controllers. hostd (retroboot/bluetooth.py) turns the radio on and off with the
# bluetooth.enabled setting, scans, pairs with its own agent and forgets devices;
# nothing else here needs changing on a device.
[General]
Name = RetroBoot
# Computer, desktop.
Class = 0x000104
# RetroBoot pairs from its side; it never makes itself discoverable.
DiscoverableTimeout = 0
PairableTimeout = 0
JustWorksRepairing = never
# Devices found in a scan stay known this long (the panel lists them a little longer).
TemporaryTimeout = 60
# Paired classic keyboards reconnect sooner after waking (costs a little idle power).
FastConnectable = true

[Policy]
# Power the adapter as soon as it appears, so paired keyboards reconnect before hostd
# runs; hostd then applies bluetooth.enabled (off: powered off and rfkill-blocked).
AutoEnable = true
