[Unit]
RequiresMountsFor=/var/lib/retroboot
After=retroboot-data-layout.service avahi-daemon.service
ConditionPathExists=/etc/cups/cupsd.conf

[Service]
ExecStartPre=/usr/bin/install -d -m 0755 -g lp /var/lib/retroboot/cups /var/lib/retroboot/cups/ppd /var/lib/retroboot/cups/interfaces
ExecStartPre=/usr/bin/install -d -m 0700 -g lp /var/lib/retroboot/cups/ssl
ExecStart=
ExecStart=/usr/sbin/cupsd -l -c /etc/cups/cupsd.conf -s /etc/cups/cups-files.conf
