# RetroBoot: Bluetooth keyboards, mice, trackpads and game controllers only.
# * Pairings live on RBDATA (var-lib-bluetooth.mount), so they survive A/B updates;
#   bluetoothd starts only after that bind mount is in place.
# * bluetoothd loads just the input plugins: classic HID (input), HID over GATT (hog)
#   and the LE services HID devices use (battery, deviceinfo, scanparam, gap). No audio
#   profiles: Bluetooth headphones (A2DP) would need the a2dp/avrcp plugins and an audio
#   server, which RetroBoot does not run (see docs/guide/bluetooth.md).
# * hostd (retroboot/bluetooth.py) powers the adapter with the bluetooth.enabled setting
#   and registers the pairing agent.
[Unit]
RequiresMountsFor=/var/lib/bluetooth
After=var-lib-bluetooth.mount

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --plugin=input,hog,battery,deviceinfo,scanparam,gap
