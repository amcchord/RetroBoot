# RetroBoot: never forward to any console or terminal. /var/log/journal is a
# bind mount of /var/lib/retroboot/logs/journal (RBDATA) when the data
# partition is available (var-log-journal.mount).
[Journal]
Storage=auto
SystemMaxUse=64M
RuntimeMaxUse=32M
ForwardToConsole=no
ForwardToWall=no
ForwardToKMsg=no
TTYPath=/dev/null
MaxLevelConsole=emerg
MaxLevelWall=emerg
